[package]
name = "poker_tournament"
version = "0.1.0"
description = "Poker Tournament Token Program on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "poker_tournament"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"

[dev-dependencies]
spl-token = { version = "4.0", features = ["no-entrypoint"] }

